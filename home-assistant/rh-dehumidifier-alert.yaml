# GreenWave — "Dehumidifiers All Off" alert
#
# The alert threshold follows the RH dial rather than sitting at a fixed
# number: move the setpoint and the alarm point moves with it.
#
# The dial is the "Grow Room Dehumidifiers" card on the Environment dashboard —
# a humidifier entity whose target RH lives in its `humidity` attribute, which
# is what the templates below read. At a setpoint of 68 % the alert fires above
# 76 % and re-arms below 73 %.
#
# Fires when the room holds 8 % above the dial for a sustained 10 minutes with
# all four dehumidifier relays off. One page per excursion.
#
# ---------------------------------------------------------------------------
# TO FILL IN BEFORE SAVING:
#
#   - The notify service — replace notify.mobile_app_your_phone with whatever
#     the existing automation already uses for your handset.
#   - The four relay entity IDs are expected slugs; confirm them in
#     Developer Tools → States.
#
# The margins are the "+ 8" in the trigger and the "+ 5" in the wait_template
# at the bottom. They are inlined rather than shared as variables because
# Home Assistant does not expose automation variables to template triggers.
# If you change one, change the other, and keep the wait_template's margin the
# smaller of the two or the alert will flap.
# ---------------------------------------------------------------------------

- id: greenwave_rh_dehumidifiers_all_off
  alias: "Alert — Dehumidifiers all off while RH above setpoint"
  description: >-
    Critical push when grow room RH holds 8 % above the dial for 10 minutes
    with every dehumidifier relay off. Threshold tracks the setpoint.
  mode: single
  max_exceeded: silent

  triggers:
    - trigger: template
      value_template: >-
        {{ states('sensor.gw_room_rh_averaged') | float(0)
           > (state_attr('humidifier.grow_room_dehumidifiers', 'humidity')
              | float(60)) + 8 }}
      for: "00:10:00"

  conditions:
    # All four relays off — i.e. nothing is actually dehumidifying.
    - condition: state
      entity_id:
        - switch.gw_dehumidifier_relay_1
        - switch.gw_dehumidifier_relay_2
        - switch.gw_dehumidifier_relay_3
        - switch.gw_dehumidifier_relay_4
      state: "off"

  actions:
    - action: notify.mobile_app_your_phone
      data:
        title: "🚨 Dehumidifiers All Off"
        message: >-
          RH is {{ states('sensor.gw_room_rh_averaged') }} % against a setpoint
          of {{ state_attr('humidifier.grow_room_dehumidifiers', 'humidity') }} %
          and ALL four dehumidifier relays are off.
          Check power / relays / breaker.
        data:
          push:
            interruption-level: critical
            sound:
              name: default
              critical: 1
              volume: 1.0

    # Hold the automation open until the room recovers, so a single excursion
    # cannot page repeatedly.
    - wait_template: >-
        {{ states('sensor.gw_room_rh_averaged') | float(0)
           < (state_attr('humidifier.grow_room_dehumidifiers', 'humidity')
              | float(60)) + 5 }}
      continue_on_timeout: true
      timeout: "06:00:00"
