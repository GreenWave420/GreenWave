# GreenWave — "Dehumidifiers All Off" alert
#
# The alert threshold follows the RH dial rather than sitting at a fixed
# number: move the setpoint and the alarm point moves with it. It fires when
# the room is `alarm_margin` above whatever the dial is set to, for a sustained
# 10 minutes, with all four dehumidifier relays off.
#
# One page per excursion. Re-arms once RH comes back to within 5 % of the dial.
#
# ---------------------------------------------------------------------------
# THREE THINGS TO FILL IN BEFORE SAVING:
#
#   1. rh_setpoint — the entity ID of your RH dial. It is a number.* or
#      input_number.* entity, so find it in Developer Tools → States by
#      filtering on "number.". This is the only value that must be right for
#      the automation to work at all.
#   2. rh_sensor and the four relay entity IDs — expected slugs are below,
#      confirm them in Developer Tools → States.
#   3. The notify service — replace notify.mobile_app_your_phone with whatever
#      the existing automation already uses for your handset.
# ---------------------------------------------------------------------------

- id: greenwave_rh_dehumidifiers_all_off
  alias: "Alert — Dehumidifiers all off while RH above setpoint"
  description: >-
    Critical push when grow room RH holds well above the RH setpoint for
    10 minutes with every dehumidifier relay off. Threshold tracks the dial.
  mode: single
  max_exceeded: silent

  variables:
    # <<< SET THIS to your RH dial's entity ID >>>
    rh_setpoint: number.gw_rh_setpoint
    rh_sensor: sensor.gw_room_rh_averaged

    # How far above the dial the room has to sit before this is a fault rather
    # than the control loop doing its job. Lower it for a tighter alarm; 0 will
    # page on every normal overshoot, which is what made the old alert useless.
    alarm_margin: 8

    # Re-arm band. RH must fall back to within this much of the dial before the
    # alert can fire again. Must be smaller than alarm_margin.
    rearm_margin: 5

    # Fallback if the dial is unavailable at evaluation time.
    setpoint_fallback: 60

  triggers:
    - trigger: template
      value_template: >-
        {{ states(rh_sensor) | float(0)
           > (states(rh_setpoint) | float(setpoint_fallback) + alarm_margin) }}
      for: "00:10:00"

  conditions:
    # All four relays off — i.e. nothing is actually dehumidifying.
    - condition: state
      entity_id:
        - switch.gw_dehumidifier_relay_1
        - switch.gw_dehumidifier_relay_2
        - switch.gw_dehumidifier_relay_3
        - switch.gw_dehumidifier_relay_4
      state: "off"

  actions:
    - action: notify.mobile_app_your_phone
      data:
        title: "🚨 Dehumidifiers All Off"
        message: >-
          RH is {{ states(rh_sensor) }} % against a setpoint of
          {{ states(rh_setpoint) }} % and ALL four dehumidifier relays are off.
          Check power / relays / breaker.
        data:
          push:
            interruption-level: critical
            sound:
              name: default
              critical: 1
              volume: 1.0

    # Hold the automation open until the room recovers, so a single excursion
    # cannot page repeatedly.
    - wait_template: >-
        {{ states(rh_sensor) | float(0)
           < (states(rh_setpoint) | float(setpoint_fallback) + rearm_margin) }}
      continue_on_timeout: true
      timeout: "06:00:00"
