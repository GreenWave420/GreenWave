# GreenWave — "Dehumidifiers All Off" alert
#
# Fires when grow room RH holds above 75 % for a sustained 10 minutes with all
# four dehumidifier relays off. One page per excursion; re-arms below 72 %.
#
# The 75 % is a fixed number, deliberately independent of the RH dial. It is a
# fault threshold — "dehumidification has failed" — not a control setpoint. If
# you move the dial, this does not move with it.
#
# ---------------------------------------------------------------------------
# TO FILL IN BEFORE SAVING:
#
#   - The notify service — replace notify.mobile_app_your_phone with whatever
#     the existing automation already uses for your handset.
#   - The four relay entity IDs are expected slugs; confirm them in
#     Developer Tools → States.
# ---------------------------------------------------------------------------

- id: greenwave_rh_dehumidifiers_all_off
  alias: "Alert — Dehumidifiers all off while RH high"
  description: >-
    Critical push when grow room RH holds above 75 % for 10 minutes with every
    dehumidifier relay off.
  mode: single
  max_exceeded: silent

  triggers:
    - trigger: numeric_state
      entity_id: sensor.gw_room_rh_averaged
      above: 75
      for: "00:10:00"

  conditions:
    # All four relays off — i.e. nothing is actually dehumidifying.
    - condition: state
      entity_id:
        - switch.gw_dehumidifier_relay_1
        - switch.gw_dehumidifier_relay_2
        - switch.gw_dehumidifier_relay_3
        - switch.gw_dehumidifier_relay_4
      state: "off"

  actions:
    - action: notify.mobile_app_your_phone
      data:
        title: "🚨 Dehumidifiers All Off"
        message: >-
          RH is {{ states('sensor.gw_room_rh_averaged') }} % and ALL four
          dehumidifier relays are off. Check power / relays / breaker.
        data:
          push:
            interruption-level: critical
            sound:
              name: default
              critical: 1
              volume: 1.0

    # Hold the automation open until the room recovers, so a single excursion
    # cannot page repeatedly.
    - wait_template: >-
        {{ states('sensor.gw_room_rh_averaged') | float(0) < 72 }}
      continue_on_timeout: true
      timeout: "06:00:00"
